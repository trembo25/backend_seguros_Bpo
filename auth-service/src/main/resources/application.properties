spring.application.name=auth-service
server.port=${PORT:8081}

# Base de datos propia de este servicio (MySQL). En Docker se cambia con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (el secreto debe tener al menos 32 caracteres y ser igual en todos los servicios)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}
app.jwt.expiracion-minutos=480
app.jwt.expiracion-reset-minutos=10

# Crea los 3 roles y los 6 usuarios de ejemplo de la app (clave: Clave123)
app.seed-demo=true

# Eureka: se registra con su IP para que funcione dentro de Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Desarrollo: refresca el registro mas seguido para que las rutas esten listas antes
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10

# Swagger: la ruta de los docs lleva el prefijo /auth para que tambien pase por el gateway
springdoc.api-docs.path=/auth/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
