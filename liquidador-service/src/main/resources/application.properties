spring.application.name=liquidador-service
server.port=${PORT:8084}

# Base de datos de este servicio (MySQL). En Docker se cambia con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/liquidador_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Debe ser EXACTAMENTE el mismo secreto que usa auth-service
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}

# Crea siniestros de ejemplo asignados a los liquidadores demo (ids 4 y 5 de auth-service)
app.seed-demo=true

# Eureka: Feign busca "auth-service" por nombre, sin URL fija
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Desarrollo: refresca el registro mas seguido para que las rutas esten listas antes
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10

# Swagger con el prefijo /liquidador para que tambien pase por el gateway
springdoc.api-docs.path=/liquidador/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
