# Perfil para probar sin MySQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:liquidadordb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
# Sin Eureka: Feign usa la URL directa de auth-service
eureka.client.enabled=false
spring.cloud.discovery.client.simple.instances.auth-service[0].uri=http://localhost:8081
