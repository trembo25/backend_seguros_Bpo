spring.application.name=api-gateway
server.port=${PORT:8090}

# Eureka: el gateway pregunta aqui donde esta cada servicio
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Desarrollo: refresca el registro mas seguido para que las rutas esten listas antes
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10

# Rutas: la app solo conoce http://IP:8090 y el gateway reenvia segun el prefijo.
# "lb://" = buscar el servicio por nombre en Eureka (con balanceo si hay varias instancias)
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=usuario-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://usuario-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/asegurado/**

spring.cloud.gateway.server.webmvc.routes[2].id=liquidador-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://liquidador-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/liquidador/**

spring.cloud.gateway.server.webmvc.routes[3].id=analista-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://analista-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/analista/**

# Swagger unificado: http://localhost:8090/swagger-ui.html
# Cada servicio publica sus docs con su prefijo, asi que pasan por las rutas de arriba.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[0].url=/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=usuario-service (asegurado)
springdoc.swagger-ui.urls[1].url=/asegurado/v3/api-docs
springdoc.swagger-ui.urls[2].name=liquidador-service
springdoc.swagger-ui.urls[2].url=/liquidador/v3/api-docs
springdoc.swagger-ui.urls[3].name=analista-service
springdoc.swagger-ui.urls[3].url=/analista/v3/api-docs
