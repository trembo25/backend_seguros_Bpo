spring.application.name=analista-service
server.port=${PORT:8085}

# Debe ser EXACTAMENTE el mismo secreto que usa auth-service
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}

# Eureka: Feign busca auth-service y liquidador-service por nombre
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Desarrollo: refresca el registro mas seguido para que las rutas esten listas antes
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=10

# Swagger con el prefijo /analista para que tambien pase por el gateway
springdoc.api-docs.path=/analista/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
